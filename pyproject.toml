[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dhoni-instagram-agent"
version = "0.1.0"
description = "Self-hosted, grounded Instagram content platform for an MS Dhoni fan account."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "pavannandivada" }]
dependencies = [
  "fastapi>=0.116,<1",
  "google-genai>=1.31,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.35,<1",
]
[project.scripts]
dhoni-migrate = "dhoni_instagram_agent.migrate:main"
dhoni-healthcheck = "dhoni_instagram_agent.healthcheck:main"
dhoni-api = "dhoni_instagram_agent.api.run:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.9,<0.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dhoni_instagram_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dhoni_instagram_agent"]
warn_unused_configs = true

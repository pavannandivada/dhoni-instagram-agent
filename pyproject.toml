[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dhoni-instagram-agent"
version = "0.3.0"
description = "Grounded Instagram content agent for MS Dhoni fan content"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    "Pillow>=10.4.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pytesseract>=0.3.13",
    "requests>=2.32.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[project.scripts]
dhoni-api = "dhoni_instagram_agent.api.app:app"
dhoni-migrate = "dhoni_instagram_agent.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
